        <a href="importar-pdf.html" class="nav-link"><i class="bi bi-file-earmark-pdf"></i> Importar PDF</a>

<div class="main-wrap">
    <div class="topbar">
        <div class="page-title">Usuários</div>
        <span class="small text-secondary" id="admin-nome"></span>
    </div>

    <div class="content">

        <div class="row g-2 mb-3">
            <div class="col-md-4">
                <input type="text" id="busca" class="form-control form-control-sm" placeholder="Buscar por nome ou email...">
            </div>
            <div class="col-auto">
                <select id="filtro-role" class="form-select form-select-sm">
                    <option value="">Todos os papéis</option>
                    <option value="usuario">Usuário</option>
                    <option value="moderador">Moderador</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
        </div>

        <div class="card-soft">
            <div class="table-responsive">
                <table class="table table-sm align-middle mb-0">
                    <thead>
                        <tr class="text-secondary small">
                            <th>Usuário</th>
                            <th>Papel</th>
                            <th class="text-center">Créditos</th>
                            <th class="text-center">Status</th>
                            <th>Cadastro</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-usuarios"></tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="assets/admin-config.js"></script>
<script>
let todosUsuarios = [];
let meuId = null;

(async () => {
    const acesso = await exigirAdmin();
    if (!acesso) return;
    meuId = acesso.session.user.id;
    document.getElementById('admin-nome').textContent = (acesso.nome || acesso.session.user.email) + ' · ' + acesso.role;

    await carregarUsuarios();
})();

async function carregarUsuarios() {
    const { data, error } = await supabaseClient.rpc('admin_listar_usuarios');
    if (error) {
        document.getElementById('tabela-usuarios').innerHTML =
            `<tr><td colspan="6" class="text-danger small">Erro ao carregar: ${error.message}</td></tr>`;
        return;
    }
    todosUsuarios = data || [];
    renderTabela(todosUsuarios);
}

function renderTabela(lista) {
    const tbody = document.getElementById('tabela-usuarios');
    tbody.innerHTML = '';

    if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-secondary small">Nenhum usuário encontrado.</td></tr>';
        return;
    }

    lista.forEach(u => {
        const dataFormatada = new Date(u.criado_em).toLocaleDateString('pt-BR');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>
                <div class="fw-semibold small">${u.nome || '(sem nome)'}</div>
                <div class="text-secondary" style="font-size:0.78rem;">${u.email}</div>
            </td>
            <td>
                <select class="form-select form-select-sm select-role" data-id="${u.id}" style="width:130px;" ${u.id === meuId ? 'disabled title="Não é possível alterar seu próprio papel"' : ''}>
                    <option value="usuario" ${u.role === 'usuario' ? 'selected' : ''}>Usuário</option>
                    <option value="moderador" ${u.role === 'moderador' ? 'selected' : ''}>Moderador</option>
                    <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
                </select>
            </td>
            <td class="text-center">
                <span class="badge text-bg-light border">${u.saldo_creditos}</span>
            </td>
            <td class="text-center">
                <button class="btn btn-sm ${u.bloqueado ? 'btn-danger' : 'btn-outline-secondary'} btn-toggle-bloqueio" data-id="${u.id}" data-bloqueado="${u.bloqueado}">
                    ${u.bloqueado ? 'Bloqueado' : 'Ativo'}
                </button>
            </td>
            <td class="small text-secondary">${dataFormatada}</td>
            <td class="text-end">
                <button class="btn btn-sm btn-outline-primary btn-add-creditos" data-id="${u.id}" data-nome="${u.nome || u.email}">
                    <i class="bi bi-plus-lg"></i> Créditos
                </button>
            </td>
        `;
        tbody.appendChild(tr);
    });

    document.querySelectorAll('.select-role').forEach(sel => {
        sel.addEventListener('change', () => alterarRole(sel.dataset.id, sel.value));
    });
    document.querySelectorAll('.btn-toggle-bloqueio').forEach(btn => {
        btn.addEventListener('click', () => alterarBloqueio(btn.dataset.id, btn.dataset.bloqueado === 'true'));
    });
    document.querySelectorAll('.btn-add-creditos').forEach(btn => {
        btn.addEventListener('click', () => adicionarCreditos(btn.dataset.id, btn.dataset.nome));
    });
}

async function alterarRole(usuarioId, novoRole) {
    const { error } = await supabaseClient.rpc('admin_atualizar_usuario', {
        usuario_id_param: usuarioId, novo_role: novoRole, novo_bloqueado: null
    });
    if (error) { alert('Erro: ' + error.message); return; }
    await carregarUsuarios();
}

async function alterarBloqueio(usuarioId, bloqueadoAtual) {
    const acao = bloqueadoAtual ? 'desbloquear' : 'bloquear';
    if (!confirm(`Confirma ${acao} este usuário?`)) return;
    const { error } = await supabaseClient.rpc('admin_atualizar_usuario', {
        usuario_id_param: usuarioId, novo_role: null, novo_bloqueado: !bloqueadoAtual
    });
    if (error) { alert('Erro: ' + error.message); return; }
    await carregarUsuarios();
}

async function adicionarCreditos(usuarioId, nome) {
    const valor = prompt(`Quantos créditos adicionar para ${nome}?`);
    if (!valor) return;
    const quantidade = parseFloat(valor);
    if (isNaN(quantidade) || quantidade <= 0) { alert('Valor inválido.'); return; }

    const { error } = await supabaseClient.rpc('admin_adicionar_creditos', {
        usuario_id_param: usuarioId, quantidade
    });
    if (error) { alert('Erro: ' + error.message); return; }
    await carregarUsuarios();
}

function aplicarFiltros() {
    const termo = document.getElementById('busca').value.trim().toLowerCase();
    const role = document.getElementById('filtro-role').value;

    let filtrado = todosUsuarios;
    if (termo) {
        filtrado = filtrado.filter(u =>
            (u.nome || '').toLowerCase().includes(termo) || (u.email || '').toLowerCase().includes(termo)
        );
    }
    if (role) filtrado = filtrado.filter(u => u.role === role);

    renderTabela(filtrado);
}

document.getElementById('busca').addEventListener('input', aplicarFiltros);
document.getElementById('filtro-role').addEventListener('change', aplicarFiltros);
</script>

</body>
</html>
