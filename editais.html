<div class="main-wrap">
    <div class="topbar">
        <div class="page-title">Editais</div>
        <span class="small text-secondary" id="admin-nome"></span>
    </div>

    <div class="content">

        <div class="card-soft mb-4" style="max-width:600px;">
            <h2 class="h6 fw-bold mb-2">Enviar / atualizar edital</h2>
            <div class="mb-2">
                <label class="form-label small fw-semibold">Concurso</label>
                <select id="select-concurso" class="form-select form-select-sm"></select>
            </div>
            <div class="mb-2">
                <label class="form-label small fw-semibold">PDF do edital</label>
                <input type="file" id="input-pdf" class="form-control form-control-sm" accept="application/pdf">
            </div>
            <div id="status-processamento" class="text-secondary small mb-2"></div>
            <button id="btn-processar" class="btn btn-gold btn-sm" disabled>Extrair e processar com IA</button>
        </div>

        <div id="resultado-edital" class="d-none" style="max-width:700px;">
            <h2 class="h6 fw-bold mb-2">Prévia do resultado</h2>
            <div id="conteudo-resultado" class="card-soft"></div>
        </div>

    </div>
</div>

<script src="assets/admin-config.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

(async () => {
    const acesso = await exigirAdmin();
    if (!acesso) return;
    document.getElementById('admin-nome').textContent = (acesso.nome || acesso.session.user.email) + ' · ' + acesso.role;

    const { data: concursos } = await supabaseClient.from('concursos').select('id, nome').eq('ativo', true).order('nome');
    const select = document.getElementById('select-concurso');
    (concursos || []).forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.nome;
        select.appendChild(opt);
    });
})();

document.getElementById('input-pdf').addEventListener('change', (e) => {
    document.getElementById('btn-processar').disabled = !e.target.files.length;
});

document.getElementById('btn-processar').addEventListener('click', async () => {
    const arquivo = document.getElementById('input-pdf').files[0];
    const concursoId = document.getElementById('select-concurso').value;
    if (!arquivo || !concursoId) return;

    const btn = document.getElementById('btn-processar');
    const statusEl = document.getElementById('status-processamento');
    btn.disabled = true;

    try {
        statusEl.textContent = 'Lendo o PDF...';
        const arrayBuffer = await arquivo.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

        let textoCompleto = '';
        for (let i = 1; i <= pdf.numPages; i++) {
            statusEl.textContent = `Extraindo texto — página ${i} de ${pdf.numPages}...`;
            const page = await pdf.getPage(i);
            const conteudo = await page.getTextContent();
            textoCompleto += conteudo.items.map(item => item.str).join(' ') + '\n\n';
        }

        statusEl.textContent = `Texto extraído (${textoCompleto.length} caracteres). Enviando pra IA organizar...`;

        const { data, error } = await supabaseClient.functions.invoke('processar-edital', {
            body: { concurso_id: concursoId, texto_edital: textoCompleto, nome_arquivo: arquivo.name }
        });

        btn.disabled = false;

        if (error || data?.error) {
            statusEl.textContent = '';
            alert('Erro: ' + (data?.error || error.message));
            return;
        }

        statusEl.textContent = data.foi_truncado
            ? '⚠️ Edital muito grande, texto foi cortado — algumas informações do final podem ter ficado de fora.'
            : 'Processado com sucesso!';
        mostrarResultado(data.informacoes);

    } catch (err) {
        btn.disabled = false;
        statusEl.textContent = '';
        alert('Erro ao processar: ' + err.message);
    }
});

function mostrarResultado(info) {
    const el = document.getElementById('conteudo-resultado');
    let html = `<p class="small">${info.resumo_geral || ''}</p>`;
    if (info.orgao_responsavel) html += `<div class="small mb-1"><strong>Órgão:</strong> ${info.orgao_responsavel}</div>`;
    if (info.banca_organizadora) html += `<div class="small mb-1"><strong>Banca:</strong> ${info.banca_organizadora}</div>`;
    if (info.taxa_inscricao) html += `<div class="small mb-1"><strong>Taxa:</strong> ${info.taxa_inscricao}</div>`;
    if (info.salario_geral) html += `<div class="small mb-2"><strong>Salário:</strong> ${info.salario_geral}</div>`;

    if (info.cargos && info.cargos.length > 0) {
        html += `<div class="small fw-bold mt-2 mb-1">Cargos</div>`;
        info.cargos.forEach(c => {
            html += `<div class="small mb-1">• ${c.nome} — ${c.vagas || '?'} vaga(s) — ${c.salario || '—'}</div>`;
        });
    }
    if (info.cronograma && info.cronograma.length > 0) {
        html += `<div class="small fw-bold mt-2 mb-1">Cronograma</div>`;
        info.cronograma.forEach(c => {
            html += `<div class="small mb-1">• ${c.evento}: ${c.data}</div>`;
        });
    }
    if (info.conteudo_programatico && info.conteudo_programatico.length > 0) {
        html += `<div class="small fw-bold mt-2 mb-1">Conteúdo programático</div>`;
        info.conteudo_programatico.forEach(m => {
            html += `<div class="small mb-1">• <strong>${m.materia}</strong>: ${(m.topicos || []).join(', ')}</div>`;
        });
    }
    if (info.informacoes_adicionais) {
        html += `<div class="small fw-bold mt-2 mb-1">Outras informações</div><p class="small">${info.informacoes_adicionais}</p>`;
    }

    el.innerHTML = html;
    document.getElementById('resultado-edital').classList.remove('d-none');
}
</script>

</body>
</html>
