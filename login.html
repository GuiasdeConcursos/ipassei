<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — ipassei</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .topo-simples {
        display: flex; align-items: center; padding: 20px 32px;
        border-bottom: 1px solid var(--line); background: var(--card);
    }
    .topo-simples .marca { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; color: var(--ink); }
    .topo-simples .marca img { height: 26px; }
    .auth-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
    .auth-content { margin: 0; }
</style>
<link rel="icon" type="image/png" href="assets/img/logo.png">
</head>
<body>

<div class="topo-simples">
    <a href="index.html" class="marca"><img src="assets/img/logo.png" alt="ipassei"> ipassei</a>
</div>

<div class="auth-wrap">
    <div class="auth-content card-soft">
        <h2 class="h4 fw-bold">Entrar na sua conta</h2>
        <p class="text-secondary small mb-4">Ou crie uma conta nova em segundos.</p>

        <div id="msg" class="alert d-none"></div>

        <button class="google-btn" id="btn-google">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.7 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.3l-6.3-5.3C29.4 35.4 26.8 36 24 36c-5.4 0-9.9-3.3-11.3-8l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.7 2.2-2.1 4.1-3.9 5.4l6.3 5.3C39.5 37 44 31.4 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
            Entrar com Google
        </button>

        <div class="divider">ou com email</div>

        <form id="form-email">
            <div class="mb-3">
                <label for="email" class="form-label small fw-semibold">Email</label>
                <input type="email" id="email" class="form-control" required placeholder="voce@email.com">
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label small fw-semibold">Senha</label>
                <input type="password" id="senha" class="form-control" required placeholder="••••••••" minlength="6">
            </div>
            <button type="submit" class="btn btn-navy w-100">Entrar</button>
        </form>

        <div class="divider">novo por aqui?</div>
        <button id="btn-cadastro" class="btn btn-outline-secondary w-100">Criar conta com email</button>
    </div>
</div>

<script src="assets/supabase-config.js"></script>
<script>
const msgEl = document.getElementById('msg');
function mostrarMsg(texto, tipo) {
    msgEl.textContent = texto;
    msgEl.className = 'alert ' + (tipo === 'error' ? 'alert-danger' : 'alert-success');
}

// Captura o código de indicação (?ref=CODIGO) se veio de um link do
// programa de fidelidade, e guarda persistente — porque se o cadastro
// exigir confirmação por email, o vínculo só pode ser feito depois,
// quando a pessoa realmente conseguir logar pela primeira vez.
(function capturarCodigoIndicacao() {
    const params = new URLSearchParams(window.location.search);
    const ref = params.get('ref');
    if (ref) localStorage.setItem('ipassei_ref_code', ref);
})();

async function registrarIndicacaoSeTiver() {
    const codigo = localStorage.getItem('ipassei_ref_code');
    if (!codigo) return;
    try {
        await supabaseClient.rpc('registrar_indicacao', { codigo_indicacao: codigo });
    } catch {
        // se der erro (código inválido, etc), não trava o login — só não vincula
    }
    localStorage.removeItem('ipassei_ref_code');
}

document.getElementById('btn-google').addEventListener('click', async () => {
    const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/dashboard.html' }
    });
    if (error) mostrarMsg('Não foi possível entrar com Google: ' + error.message, 'error');
});

document.getElementById('form-email').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
    if (error) {
        mostrarMsg('Email ou senha incorretos.', 'error');
    } else {
        await registrarIndicacaoSeTiver();
        window.location.href = 'dashboard.html';
    }
});

document.getElementById('btn-cadastro').addEventListener('click', async () => {
    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;
    if (!email || !senha) {
        mostrarMsg('Preencha email e senha para criar a conta.', 'error');
        return;
    }
    const { error } = await supabaseClient.auth.signUp({ email, password: senha });
    if (error) {
        const detalhe = error.message || JSON.stringify({ status: error.status, name: error.name, code: error.code });
        mostrarMsg('Erro ao criar conta: ' + detalhe, 'error');
    } else {
        await registrarIndicacaoSeTiver(); // funciona na hora se o cadastro não exigir confirmação por email
        mostrarMsg('Conta criada! Verifique seu email para confirmar antes de entrar.', 'success');
    }
});
</script>
<script src="assets/menu-toggle.js"></script>
</body>
</html>
