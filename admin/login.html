<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso Administrativo — ipassei</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" type="image/png" href="assets/img/logo.png">
</head>
<body style="background:var(--navy); min-height:100vh; display:flex; align-items:center; justify-content:center;">

<div style="width:100%; max-width:380px; padding:20px;">
    <div class="text-center mb-4">
        <img src="../assets/img/logo.png" alt="ipassei" style="height:36px;">
        <div class="text-white-50 small mt-2"><i class="bi bi-shield-lock"></i> Área administrativa</div>
    </div>

    <div class="card-soft">
        <div id="msg" class="alert d-none"></div>

        <form id="form-login">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Email</label>
                <input type="email" id="email" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Senha</label>
                <input type="password" id="senha" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-navy w-100">Entrar</button>
        </form>
    </div>

    <div class="text-center mt-3">
        <a href="../index.html" class="text-white-50 small">← Voltar para o site</a>
    </div>
</div>

<script src="assets/admin-config.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
if (params.get('erro') === 'acesso_negado') {
    const msg = document.getElementById('msg');
    msg.textContent = 'Sua conta não tem permissão de administrador.';
    msg.className = 'alert alert-danger';
    msg.classList.remove('d-none');
}

document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;
    const msg = document.getElementById('msg');

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
    if (error) {
        msg.textContent = 'Email ou senha incorretos.';
        msg.className = 'alert alert-danger';
        msg.classList.remove('d-none');
        return;
    }

    const { data: perfil } = await supabaseClient
        .from('usuarios_perfil').select('role').eq('id', data.user.id).single();

    if (!perfil || !['admin', 'moderador'].includes(perfil.role)) {
        await supabaseClient.auth.signOut();
        msg.textContent = 'Sua conta não tem permissão de administrador.';
        msg.className = 'alert alert-danger';
        msg.classList.remove('d-none');
        return;
    }

    window.location.href = 'concursos.html';
});
</script>
<script src="assets/menu-toggle.js"></script>
</body>
</html>
